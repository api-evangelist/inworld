description: >-
  FOCUS-aligned FinOps view of Inworld AI. Inworld combines a credit-based monthly
  subscription with usage-based meters across TTS (per 1M characters), STT (per hour), and
  LLM Router (provider passthrough). Higher tiers unlock 20-40% off rates.
notes: Plan tier sizing materially affects unit costs across all four products.
